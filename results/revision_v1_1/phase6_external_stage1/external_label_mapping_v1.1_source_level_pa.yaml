negative_label:
  name: no_finding
  rule: No finding == 1 AND every other image-level label == 0
positive_label:
  name: pneumonia_related_dataset_label
  rule: (Pneumonia == 1 OR Brocho-pneumonia == 1) AND every other image-level label == 0
required_integrity_checks:
  sha256_match: true
  dicom_parseable: true
  pixel_array_decodable: true
prohibitions:
  - no Stage 2 evaluation
  - no pathology, microbiological, or clinical-diagnosis claim
  - no tuning of checkpoint, preprocessing, threshold, or inclusion rule after results exist
  - no patient-level or per-image-view-verification claim
