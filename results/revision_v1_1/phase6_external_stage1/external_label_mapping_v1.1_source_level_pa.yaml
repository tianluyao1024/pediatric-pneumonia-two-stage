status: USER_APPROVED_PENDING_TWO_AUTHOR_INFERENCE_APPROVAL
mapping_version: v1.1
supersedes: external_label_mapping_v1.0.yaml
protocol_amendment: protocol/protocol_amendment_v1.3.md
dataset: VinDr-PCXR v1.0.0
evaluation_role: external_stage1_feasibility_evaluation_only
source_partition: original_test
external_unit: anonymous_image_id
patient_level_claims: prohibited
view_assurance:
  method: source_level_release_documentation
  source_statement: released pediatric cohort described as PA chest radiographs
  per_image_dicom_viewposition: absent_in_all_339_audited_files
  per_image_dicom_modality: absent_in_all_339_audited_files
